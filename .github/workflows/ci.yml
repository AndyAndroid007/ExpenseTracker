name: ExpenseTrack CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expensetrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./server

      - name: Setup Prisma Client & Database Migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/expensetrack_test
        run: |
          npx prisma db push --accept-data-loss
        working-directory: ./server

      - name: Execute Jest Test Suite
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/expensetrack_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-key-12345
          NODE_ENV: test
        run: npm test
        working-directory: ./server
